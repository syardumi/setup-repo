name: Setup Repo Secrets

# Manual trigger, runnable from the GitHub mobile app.
# Lives in a single "control" repo (e.g. steve-dev/ci-tools).
# Pass in the target repo's name and this will push the standard
# secrets and variables into it, so no laptop or terminal is needed.
#
# Setup (one-time, do this from a browser once):
#   1. Create a GitHub Personal Access Token (classic or fine-grained)
#      with "repo" and "admin:repo_hook" / secrets scopes, that has
#      access to all the repos you'll be provisioning.
#   2. In THIS control repo, add these as Actions secrets:
#        CONTROL_PAT             - the token from step 1
#        ANTHROPIC_API_KEY       - your standard Claude API key
#        AWS_ACCESS_KEY_ID       - your standard AWS access key
#        AWS_SECRET_ACCESS_KEY   - your standard AWS secret key
#
# To run from mobile:
#   Open this repo in the GitHub app > Actions tab >
#   "Setup Repo Secrets" > Run workflow > enter owner/repo > Run.

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Target repo in owner/name form, e.g. steve-dev/quelby-service"
        required: true
        type: string
      aws_region:
        description: "AWS region for the target repo"
        required: false
        default: "us-east-1"
        type: string

jobs:
  push-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Set up GitHub CLI auth
        run: echo "${{ secrets.CONTROL_PAT }}" | gh auth login --with-token
        env:
          GH_TOKEN: ${{ secrets.CONTROL_PAT }}

      - name: Push secrets to target repo
        env:
          GH_TOKEN: ${{ secrets.CONTROL_PAT }}
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          gh secret set ANTHROPIC_API_KEY --repo "$TARGET_REPO" --body "${{ secrets.ANTHROPIC_API_KEY }}"
          gh secret set AWS_ACCESS_KEY_ID --repo "$TARGET_REPO" --body "${{ secrets.AWS_ACCESS_KEY_ID }}"
          gh secret set AWS_SECRET_ACCESS_KEY --repo "$TARGET_REPO" --body "${{ secrets.AWS_SECRET_ACCESS_KEY }}"

      - name: Push variables to target repo
        env:
          GH_TOKEN: ${{ secrets.CONTROL_PAT }}
          TARGET_REPO: ${{ inputs.target_repo }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          gh variable set AWS_REGION --repo "$TARGET_REPO" --body "$AWS_REGION"
          gh variable set DEV_ENVIRONMENT_NAME --repo "$TARGET_REPO" --body "dev"
          gh variable set PROD_ENVIRONMENT_NAME --repo "$TARGET_REPO" --body "production"

      - name: Confirm
        env:
          GH_TOKEN: ${{ secrets.CONTROL_PAT }}
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          echo "Secrets and variables configured for $TARGET_REPO"
          gh secret list --repo "$TARGET_REPO"
          gh variable list --repo "$TARGET_REPO"
